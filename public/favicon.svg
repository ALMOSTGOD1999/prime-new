<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gold diamond shape - two interlocking diamonds -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5960C"/>
      <stop offset="50%" style="stop-color:#D4A91A"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Left diamond -->
  <polygon points="20,8 38,24 20,40 2,24" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right diamond -->
  <polygon points="44,8 62,24 44,40 26,24" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
</svg>
